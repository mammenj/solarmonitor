{{ define "energy_flow.svg" }}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" class="w-full h-full">
    <!-- Dark Background -->
    <rect width="700" height="250" fill="#0f172a" rx="8" />

    <!-- Grid Lines -->
    <line x1="50" y1="40" x2="660" y2="40" stroke="#1e293b" stroke-width="1" />
    <line x1="50" y1="100" x2="660" y2="100" stroke="#1e293b" stroke-width="1" />
    <line x1="50" y1="160" x2="660" y2="160" stroke="#1e293b" stroke-width="1" />
    <line x1="50" y1="200" x2="660" y2="200" stroke="#334155" stroke-width="1.5" /> <!-- Baseline -->

    <!-- Dynamic Bars from Domain Data -->
    {{ $max := 1500.0 }} <!-- Set max scale ceiling based on expected max kWh -->
    {{ $baseY := 200.0 }}
    {{ $barMaxH := 150.0 }}

    {{ range $i, $pt := .ChartData }}
        {{ $xGroup := add 70 (mul $i 120) }}
        
        <!-- Solar Gen Bar (Amber) -->
        {{ $solarH := scaleHeight $pt.SolarGen $max $barMaxH }}
        <rect x="{{ $xGroup }}" y="{{ sub $baseY $solarH }}" width="18" height="{{ $solarH }}" fill="#f59e0b" rx="2" />
        
        <!-- Export Bar (Emerald) -->
        {{ $exportH := scaleHeight $pt.Export $max $barMaxH }}
        <rect x="{{ add $xGroup 22 }}" y="{{ sub $baseY $exportH }}" width="18" height="{{ $exportH }}" fill="#10b981" rx="2" />

        <!-- Import Bar (Red) -->
        {{ $importH := scaleHeight $pt.Import $max $barMaxH }}
        <rect x="{{ add $xGroup 44 }}" y="{{ sub $baseY $importH }}" width="18" height="{{ $importH }}" fill="#ef4444" rx="2" />

        <!-- X Axis Label -->
        <text x="{{ add $xGroup 31 }}" y="222" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">
            {{ $pt.Label }}
        </text>
    {{ end }}

    <!-- Legend -->
    <rect x="230" y="15" width="10" height="10" fill="#f59e0b" rx="2" />
    <text x="245" y="24" fill="#94a3b8" font-size="10" font-family="sans-serif">Solar</text>

    <rect x="310" y="15" width="10" height="10" fill="#10b981" rx="2" />
    <text x="325" y="24" fill="#94a3b8" font-size="10" font-family="sans-serif">Export</text>

    <rect x="390" y="15" width="10" height="10" fill="#ef4444" rx="2" />
    <text x="405" y="24" fill="#94a3b8" font-size="10" font-family="sans-serif">Import</text>
</svg>
{{ end }}
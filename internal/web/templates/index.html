<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar & Grid Monitor</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <!-- Embedded Offline JavaScript Dependencies -->
    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/alpine.min.js" defer></script>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 overflow-y-auto">

    <div class="max-w-7xl w-full mx-auto p-3 sm:p-6 flex-1 flex flex-col" x-data="{ showForm: false }">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-4 sm:mb-8 border-b border-slate-800 pb-3 sm:pb-4 gap-2">
            <div class="flex items-center gap-2">
                <span class="text-xl sm:text-2xl">⚡</span>
                <h1 class="text-base sm:text-2xl font-bold text-amber-500 tracking-tight">
                    Solar & Grid Meter
                </h1>
            </div>

            <button @click="showForm = !showForm" 
                    class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-slate-950 font-semibold text-xs sm:text-sm px-3 py-1.5 sm:px-4 sm:py-2 rounded transition flex items-center gap-1 shrink-0">
                <span x-text="showForm ? 'Close Form' : '+ Add Reading'"></span>
            </button>
        </header>
<!-- Inside index.html / layout.html -->
<main id="tab-content" class="flex-1 overflow-y-auto p-4 sm:p-6">
    <!-- HTMX swaps content here -->
{{ template "dashboard-content" . }}

</main>
        <!-- Dynamic HTMX Swap Container 
        <main id="dashboard" hx-get="/" hx-trigger="readingAdded from:body" hx-target="#dashboard" hx-swap="outerHTML" class="flex-1">
            {{ template "dashboard-content" . }}
        </main> -->

    </div>

</body>
</html>
